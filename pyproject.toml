[project]
name = "polymarket-bot"
version = "0.1.0"
description = "Polymarket trading bot: data ingestion, signal generation, and gated order execution."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.0",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "py-clob-client>=0.34.6",
    "python-dotenv>=1.2.2",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
